name: Site preview

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Comment PR – building
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: preview
          message: |
            :hourglass_flowing_sand: Building site preview...

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            themes/capro-tw/package-lock.json
            scripts/a11y/package-lock.json

      - name: Install theme dependencies
        run: npm ci --prefix themes/capro-tw

      - name: Set env parameters
        run: |
          hugovr=$(cat .hugo_version)
          echo "hugovr=$hugovr" >> $GITHUB_ENV

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.hugovr }}
          extended: true

      - name: Build
        env:
          HUGO_GMAP_API: ${{ secrets.HUGO_GMAP_API }}
        run: |
          hugo --minify \
            --baseURL https://${{github.event.number}}--capro-uio.netlify.app

      - name: Install netlify cli
        run: npm install netlify-cli -g

      - name: Deploy preview
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          netlify deploy \
            --dir ./public/ \
            --alias ${{github.event.number}}
        shell: sh

      - name: Content accessibility lint
        run: node scripts/a11y/content.mjs

      - name: Link check
        id: links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --no-progress
            --root-dir ${{ github.workspace }}/public
            'public/**/*.html'
          output: lychee-report.md
          fail: true

      - name: Accessibility audit
        id: a11y
        if: github.event_name == 'pull_request'
        run: |
          url=https://${{github.event.number}}--capro-uio.netlify.app
          # the alias is not always live the instant `netlify deploy` returns
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/") || code=000
            [ "$code" = "200" ] && break
            echo "waiting for $url ($code)"; sleep 5
          done
          npm ci --prefix scripts/a11y
          BASE=https://${{github.event.number}}--capro-uio.netlify.app \
            node scripts/a11y/run.mjs --report "$GITHUB_WORKSPACE/a11y-report.md"

      - name: Comment PR – accessibility
        if: always() && github.event_name == 'pull_request' && hashFiles('a11y-report.md') != ''
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: a11y
          file-path: a11y-report.md

      - name: Comment PR – success
        if: success() && github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: preview
          message: |
            :white_check_mark: Preview deployed at https://${{github.event.number}}--capro-uio.netlify.app
            Please check it looks ok before merging.

      - name: Comment PR – failure
        if: failure() && steps.a11y.outcome != 'failure' && github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: preview
          message: |
            :x: Preview build failed. [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      # The audit failing means the preview deployed fine but has a11y issues;
      # the report is posted separately, so just keep the preview link honest.
      - name: Comment PR – deployed but audit failed
        if: always() && steps.a11y.outcome == 'failure' && github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: preview
          message: |
            :white_check_mark: Preview deployed at https://${{github.event.number}}--capro-uio.netlify.app
            :warning: The accessibility audit found issues — see the report below.
