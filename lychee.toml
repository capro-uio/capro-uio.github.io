# Link checking. Runs over the built site, so it follows what readers actually
# get — rendered links, aliases and redirects included.
#
# Running it locally: build with a local baseURL first, or absolute links
# (og:image, canonical) point at the live site and 404 against fingerprints
# that only exist in this build.
#
#   hugo --minify --baseURL http://localhost:1313/
#   lychee --config lychee.toml --root-dir "$PWD/public" \
#     --exclude '^http://localhost:1313' 'public/**/*.html'

exclude = [
  # Preview aliases are generated per PR and 404 until the deploy lands; the
  # audit step already verifies the preview is reachable.
  '^https?://[0-9]+--capro-uio\.netlify\.app',
  '^https?://localhost',
  '^https?://127\.0\.0\.1',

  # Served from outside Hugo: capro.dev/nettskjemar/ is live in production
  # but is not built from this repo, so it is absent from every preview.
  '^/nettskjemar',
  'nettskjemar$',
]

# Taxonomy pages only repeat links that are already checked on the pages
# themselves, and there are hundreds of them.
exclude_path = ["public/categories", "public/tags"]

# LinkedIn, Twitter/X and some journals answer any non-browser client with
# 403 or 999. Failing on those would train people to ignore this check.
accept = ["200", "202", "206", "403", "429", "999"]

max_retries = 2
retry_wait_time = 3
timeout = 20
max_concurrency = 8

# Mail links are checked for syntax only; no SMTP probing.
include_mail = true
