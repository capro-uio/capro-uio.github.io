{{- /* The project title, linked to its repository when there is one. The link
       leaves the site, so say so for anyone who cannot see the icon. */ -}}
{{- if .Params.link -}}
  <a href="{{ .Params.link | safeURL }}" target="_blank" rel="noopener">
    {{- .Title -}}
    <span class="sr-only"> ({{ T "opensExternally" }})</span>
    <i class="ti-new-window portfolio-link__icon" aria-hidden="true"></i>
  </a>
{{- else -}}
  {{- .Title -}}
{{- end -}}
