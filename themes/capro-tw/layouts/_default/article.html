<article class="reveal">
  <div class="bg-dark overflow-hidden">
    {{ range first 1 (.Resources.ByType "image") }}
      {{ $image := (.Resize "600x webp").Fit "300x300 webp" }}
      <img src="{{ $image.RelPermalink }}" alt="{{ partial "helpers/img-alt.html" (dict "page" $ "resource" . "fallback" $.Title) }}" class="w-full" loading="lazy">
    {{ end }}
    <div class="p-5">
      {{/* Only rendered from _default/list.html, whose section title is the page h1. */}}
      <h2 class="text-lg mb-2"><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
      <p class="text-sm mb-4">{{ .Summary }}</p>
      <a class="btn btn-outline text-xs" href="{{ .Permalink }}">{{ i18n "readMore" }}</a>
    </div>
  </div>
</article>
