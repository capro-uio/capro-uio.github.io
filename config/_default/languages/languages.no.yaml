  home: Hjem
  description: |
    CAPRO er et data- og programvareteam ved Universitetet i Oslo. Vi rydder
    opp i rotete forskningsdata, setter opp trygg datainnsamling, gjør analyser
    reproduserbare, kjører store jobber på universitetets tjenere, og lærer
    forskningsgrupper å gjøre det selv.
  copyright: Opphavsrett &copy; 2022 Capro
  banner:
    title: Står du fast på datadelen av forskningen?
    content: |
      Vi er et data- og programvareteam ved Universitetet i Oslo. Vi rydder opp
      i rotete data, setter opp trygg innsamling, får analyser til å gi samme
      svar to ganger, og får store jobber opp på universitetets tjenere — eller
      lærer gruppa di å gjøre det selv.
    image: images/image-from-rawpixel-id-3337467-jpeg.jpg
    buttons:
      - label: Dette kan vi hjelpe med
        link: /services/
        style: primary
      - label: Spør oss om prosjektet ditt
        link: "#contact"
        style: outline
  help:
    title: Slik kan vi hjelpe
    content: |
      Dette er problemene folk faktisk kommer med. Hvert av dem kan være én
      samtale, et kurs, eller et prosjekt vi kjører sammen med deg.
    button:
      label: Se hva hvert av dem innebærer
      link: /services/
  people:
    title: Teamet
    button:
      label: Mer om teamet
      link: /team/
  contact:
    title: Ta kontakt
    email: capro-contact@psykologi.uio.no
    intro: |
      Fortell oss hva du står fast på, med dine egne ord — du trenger ikke vite
      hva det heter på fagspråket. Vi sier ærlig fra om vi kan hjelpe.
    item:
