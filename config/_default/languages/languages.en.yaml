  weight: 1
  home: Home
  description: |
    CAPRO is a data and software team at the University of Oslo. We tidy up
    messy research data, set up secure data collection, make analyses
    reproducible, run large jobs on university servers, and teach research
    groups to do it themselves.
  copyright: Capro
  banner:
    title: Stuck on the data side of your research?
    content: |
      We are a data and software team at the University of Oslo. We tidy up
      messy data, set up safe collection, make analyses run the same way twice,
      and get big jobs onto university servers — or teach your group to do it
      themselves.
    image: images/image-from-rawpixel-id-3337467-jpeg.jpg
    buttons:
      - label: What we can help with
        link: /services/
        style: primary
      - label: Ask us about your project
        link: "#contact"
        style: outline
  help:
    title: How we can help
    content: |
      These are the problems people actually arrive with. Each one can be a
      single conversation, a workshop, or a project we run alongside you.
    button:
      label: See what each one involves
      link: /services/
  people:
    title: The team
    button:
      label: More about the team
      link: /team/
  contact:
    title: Get in touch
    email: capro-contact@psykologi.uio.no
    intro: |
      Tell us what you are stuck on, in your own words — you do not need to know
      what the technical name for it is. We will tell you honestly whether we
      can help.
    item:
      - icon: ti-location-pin
        info: |
          Harald Schjelderups hus,\
          Forskningsveien 3A,\
          0373 Oslo,\
          Norway
