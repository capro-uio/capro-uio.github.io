# Grouped by the question a visitor is asking, not by our org chart.
#   "What we do" -> can you help me, have you done it before, what does it cost
#   News         -> a plain link; it is a feed, not a category
#   Contact      -> the action, never nested
# The team lives on the landing page and at /team/, linked from there and
# from the footer, so it does not need a nav slot of its own.
main:
  - identifier: whatwedo
    weight: 1
  - identifier: services
    parent: whatwedo
    url: /services/
    weight: 1
  - identifier: portfolio
    parent: whatwedo
    url: /portfolio/
    weight: 2
  - identifier: prices
    parent: whatwedo
    url: /pricing/
    weight: 3

  - identifier: news
    url: /news/
    weight: 2

  - identifier: contact
    url: '#contact'
    weight: 3
